[theme]
base = "light"
primaryColor = "#2b30a3"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f5f7"
textColor = "#26273d"
borderColor = "#e3e4e8"
linkColor = "#2b30a3"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
baseRadius = "0.6rem"
chartCategoricalColors = ["#8b3a26", "#c4a22c", "#2b30a3", "#3e3f66", "#80818f"]
# los nombres de color de Streamlit (:red[...], badges) mapeados a la paleta del proyecto:
# red = burnt orange (datos), orange/yellow = chartreuse oscuro (modelo), blue = electric blue (resultado)
redColor = "#8b3a26"
orangeColor = "#a8871a"
yellowColor = "#a8871a"
blueColor = "#2b30a3"
violetColor = "#3e3f66"

[theme.sidebar]
backgroundColor = "#f7f7f9"
secondaryBackgroundColor = "#ececf0"
# en el índice los enlaces se leen como texto, no como enlaces azules subrayados
linkColor = "#26273d"
linkUnderline = false
